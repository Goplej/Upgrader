## Mod Properties

mod_id=upgrader
mod_name=Upgrader
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.upgrader
mod_authors=Upgrader Team
mod_description=Upgrader is a dynamic item-value engine for Minecraft 1.20.1. The numeric value of any ItemStack - from minecraft:dirt to avaritia:cosmic_neutronium - is computed at runtime from recipes, tags, item properties, NBT complexity and optional integrations (ProjectE, Avaritia, Re:Avaritia). There are no hardcoded per-item value tables; every contribution is reported in a transparent breakdown. On top of the value engine, Upgrader provides configurable upgrade curves, an upgrade capability, GUI, network packets and admin commands.
