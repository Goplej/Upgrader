name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Commit build log on failure
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout "$GITHUB_REF_NAME"
          tail -c 300000 build.log > log-tail.txt || true
          git add --force log-tail.txt
          git commit -m "CI: build log tail [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: upgrader-mc1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
