name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Minecraft 1.20.1 / Forge)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-upgradermod-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-upgradermod-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew --no-daemon --stacktrace build

      - name: Store the current compiled jar deliverable
        if: github.ref == 'refs/heads/arena/01a0c787-upgrader' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          cp build/libs/*.jar deliverables/upgradermod-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deliverables/upgradermod-1.0.0.jar
          git commit -m "Refresh compiled mod jar [skip ci]"
          git push

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
