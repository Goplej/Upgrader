name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build (Minecraft 1.20.1 / Forge)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-upgradermod-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-upgradermod-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          exit "${code}"

      - name: Publish failure excerpt
        if: steps.build.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Upgrader build failed"
            echo
            echo '```'
            grep -nE "error:|warning:|FAILURE:|What went wrong|Caused by:|Execution failed|> Task .*(FAILED)|Could not" build.log | tail -n 150
            echo '```'
            echo
            echo "<details><summary>last 120 log lines</summary>"
            echo
            echo '```'
            tail -n 120 build.log
            echo '```'
            echo
            echo "</details>"
          } > excerpt.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat excerpt.md)" || echo "could not publish the excerpt"

      - name: Upload mod jar
        if: steps.build.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: upgradermod-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Fail the job when the build failed
        if: steps.build.outputs.exit != '0'
        run: |
          echo "Gradle build failed with exit code ${{ steps.build.outputs.exit }}"
          exit 1
